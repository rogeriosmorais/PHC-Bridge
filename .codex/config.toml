[mcp_servers.graph]
command = "npx"
args = ["-y", "@mcp-graph-workflow/mcp-graph"]
cwd = "."

[mcp_servers.graph.tools.context]
approval_mode = "approve"

[mcp_servers.graph.tools.start_task]
approval_mode = "approve"

[mcp_servers.graph.tools.analyze]
